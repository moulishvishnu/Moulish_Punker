<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Cyber Volleyball: Overdrive</title>
    
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #0c0514; 
            font-family: 'Orbitron', 'Segoe UI', system-ui, sans-serif; user-select: none;
            touch-action: none;
        }
        
        /* Enlarged High-Contrast Instagram Styled HUD */
        #hud {
            position: absolute;
            top: env(safe-area-inset-top, 12px);
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 96%;
            max-width: 520px;
            pointer-events: none;
            z-index: 10;
        }
        .hud-card {
            background: linear-gradient(135deg, rgba(131, 58, 180, 0.85) 0%, rgba(253, 29, 29, 0.85) 50%, rgba(252, 176, 69, 0.85) 100%);
            border: 2px solid #ffffff;
            clip-path: polygon(8px 0%, 100% 0%, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0% 100%, 0% 8px);
            box-shadow: 0 0 20px rgba(253, 29, 29, 0.4);
            padding: 8px 6px;
            color: white;
            text-align: center;
            backdrop-filter: blur(6px);
        }
        .hud-card.high { border-color: #fcb045; box-shadow: 0 0 20px rgba(252, 176, 69, 0.5); }
        .hud-card.multiplier { border-color: #833ab4; box-shadow: 0 0 20px rgba(131, 58, 180, 0.5); }
        
        .hud-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1.2px; color: #ffffff; opacity: 0.9; margin-bottom: 3px; font-weight: 800; }
        .hud-value { font-size: 19px; font-weight: 900; font-family: monospace; text-shadow: 0 0 8px rgba(255,255,255,0.6); }
        
        /* Live Commentary Banner */
        #commentary-box {
            position: absolute;
            top: calc(env(safe-area-inset-top, 12px) + 64px);
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 440px;
            background: rgba(12, 5, 20, 0.88);
            border-left: 3.5px solid #e1306c;
            padding: 6px 12px;
            font-size: 12px;
            color: #ffffff;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 10;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            font-style: italic;
        }

        #instructions { 
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 10px) + 5px); 
            left: 50%; transform: translateX(-50%); 
            color: #fccc63; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
            text-shadow: 0 0 10px rgba(252, 176, 69, 0.7); pointer-events: none; z-index: 10;
            background: rgba(12, 5, 20, 0.93); padding: 8px 18px; 
            border: 1.5px solid #e1306c;
            border-radius: 4px; width: 85%; max-width: 380px; text-align: center;
            font-weight: 700;
        }

        /* Camera Switch Control Overlay */
        #cam-toggle {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 10px) + 5px);
            right: 15px;
            background: linear-gradient(135deg, #833ab4, #e1306c);
            border: 1.5px solid #ffffff;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 10px;
            padding: 8px 12px;
            cursor: pointer;
            z-index: 20;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(225,48,108,0.4);
            border-radius: 4px;
            letter-spacing: 0.5px;
        }
        #cam-toggle:active { background: #fd1d1d; }

        #audio-prompt {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #2c1a3a 0%, #0c0514 100%); 
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; color: white;
            padding: 20px; text-align: center;
        }
        h1 { 
            font-size: clamp(28px, 7vw, 54px); margin-bottom: 25px; letter-spacing: 6px; 
            text-shadow: 0 0 20px #e1306c, 0 0 40px #fcb045; text-transform: uppercase;
            font-weight: 900;
        }
        
        .poster-art {
            width: 220px; height: 300px;
            background-image: url('https://cdn.displate.com/artwork/270x380/2025-10-13/1efe42b9-accb-4ed0-bc25-7bf87cda9a63.jpg');
            background-size: cover; background-position: center;
            border-radius: 4px; border: 3px solid #fd1d1d;
            box-shadow: 0 0 35px rgba(253, 29, 29, 0.7); margin-bottom: 35px;
            animation: float 2.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1deg); }
        }

        .play-btn {
            background: linear-gradient(135deg, #833ab4 0%, #fd1d1d 50%, #fcb045 100%); border: 2px solid white;
            color: #fff; padding: 15px 45px; font-size: clamp(18px, 4vw, 24px); font-weight: 900;
            cursor: pointer; box-shadow: 0 0 35px rgba(253,29,29,0.5);
            text-transform: uppercase; letter-spacing: 3px;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            transition: transform 0.1s ease;
        }
        .play-btn:active { transform: scale(0.95); }
        
        @media (min-width: 768px) {
            .hud-card { padding: 10px 20px; border-width: 2.5px; }
            .hud-value { font-size: 24px; }
            .hud-label { font-size: 10px; }
            #instructions { font-size: 13px; width: auto; max-width: none; }
            #commentary-box { font-size: 14px; max-width: 480px; top: calc(env(safe-area-inset-top, 12px) + 74px); }
            #cam-toggle { font-size: 11px; padding: 8px 16px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="audio-prompt">
        <h1>Cyber Volleyball<br><span style="font-size:0.5em; color:#fcb045;">Overdrive</span></h1>
        <div class="poster-art"></div>
        <button class="play-btn" onclick="initGameAudio()">Enter Arena</button>
    </div>

    <div id="hud">
        <div class="hud-card">
            <div class="hud-label">Score</div>
            <div class="hud-value" id="score">0</div>
        </div>
        <div class="hud-card multiplier">
            <div class="hud-label">Multiplier</div>
            <div class="hud-value" id="mult">x1</div>
        </div>
        <div class="hud-card high">
            <div class="hud-label">Top Record</div>
            <div class="hud-value" id="highscore">0</div>
        </div>
    </div>
    
    <div id="commentary-box">Waiting for match authorization...</div>
    <div id="instructions">Slam the ball! Touch "Change Camera Angle"</div>
    <button id="cam-toggle" onclick="cycleCamera()">Change Camera Angle</button>

    <script>
        // --- 1. GLOBAL STATE DECLARATIONS ---
        let scene, camera, renderer;
        let keyLightLeft, keyLightRight, court, courtGrid;
        let netGroup, audienceGroup, audienceMembers = [];
        let playerLeft, playerRight;
        let lightMasts = [];
        
        let currentCamMode = 0; 
        let targetCamPos = new THREE.Vector3();
        let targetCamLookAt = new THREE.Vector3(0, 1.8, 0);
        let actualCamLookAt = new THREE.Vector3(0, 1.8, 0);
        let dynamicFovBase = 54;

        const ballRadius = 0.42;
        let ballGroup, ballCore, ballRing1, ballRing2, hitBoxCollider;
        let shockwave, shockwaveMat, particleGeometry, particleMaterial, particleSystem;
        const particleCount = 45;
        const velocities = [];

        // Audio and Speech Variables
        let audioCtx, musicInterval;
        let dynamicVoiceProfile = null;
        let isArenaActive = false; // Flag to strict check user permission before any commentary triggers

        let ballPos = new THREE.Vector3(4, 5.5, 0);
        let ballVelocity = new THREE.Vector3(-4.0, 5.5, 1.0); 
        let gravity = -14.0; 
        
        let baseScore = 0, streakMultiplier = 1, cumulativeScore = 0, highScore = 0;
        let cameraShakeIntensity = 0;
        
        const clock = new THREE.Clock(); 
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let targetFactor = window.innerWidth < 768 ? 6.2 : 4.6;

        // Pure Volleyball Related Commentary Arrays
        const hitCommentaries = [
            "What a spectacular save on the baseline!",
            "Incredible pancake dig to keep it alive!",
            "Perfect set, a heavy spike is coming!",
            "A beautiful cross-court bump!",
            "Monster block cleanly redirected!",
            "Great coverage by the back row!"
        ];
        const streakCommentaries = [
            "They are running away with this rally!",
            "Unstoppable momentum at the net!",
            "This side-out rhythm is flawless!",
            "Absolute dominance on the attack!",
            "What a clinic in transition play!"
        ];
        const faultCommentaries = [
            "Out of bounds! Point dropped.",
            "Shanked pass, side-out!",
            "Netted it! Fault!",
            "Ball down on the court floor!"
        ];

        // Speech Engine Profile Binding (No execution/speaking happens here)
        function loadVoices() {
            if ('speechSynthesis' in window) {
                const voices = window.speechSynthesis.getVoices();
                dynamicVoiceProfile = voices.find(v => 
                    v.name.toLowerCase().includes('natural') ||
                    v.name.toLowerCase().includes('google') ||
                    v.name.toLowerCase().includes('samantha') || 
                    v.name.toLowerCase().includes('zira') || 
                    v.name.toLowerCase().includes('hazel') ||
                    v.name.toLowerCase().includes('moira')
                ) || voices.find(v => v.lang.startsWith('en'));
            }
        }
        
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        function triggerVoiceLine(text) {
            if (!isArenaActive) return; // Hard block speech if player is still on the main menu splash screen
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                if (dynamicVoiceProfile) utterance.voice = dynamicVoiceProfile;
                
                utterance.pitch = 1.05; 
                utterance.rate = 1.02; 
                window.speechSynthesis.speak(utterance);
            }
        }

        function triggerCommentary(type) {
            if (!isArenaActive) return; // Hard block generation before match interface loads
            const el = document.getElementById('commentary-box');
            let pool = [];
            if(type === 'hit') pool = hitCommentaries;
            else if(type === 'streak') pool = streakCommentaries;
            else if(type === 'fault') pool = faultCommentaries;
            
            const txt = pool[Math.floor(Math.random() * pool.length)];
            el.innerText = `[ANNOUNCER]: ${txt}`;
            el.style.borderLeftColor = type === 'fault' ? '#833ab4' : (type === 'streak' ? '#fcb045' : '#e1306c');

            triggerVoiceLine(txt);
        }

        // --- 2. ADVANCED SPORTS AUDIO SYNTH ENGINE ---
        function initGameAudio() {
            document.getElementById('audio-prompt').style.display = 'none';
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            loadVoices(); 
            
            // Activate the arena logic and start announcements immediately inside safe callback
            isArenaActive = true; 

            const welcomeText = "Welcome live to the stadium! The service is up, let's play ball!";
            document.getElementById('commentary-box').innerText = `[ANNOUNCER]: ${welcomeText}`;
            triggerVoiceLine(welcomeText);

            let drumStep = 0;
            musicInterval = setInterval(() => {
                if(!audioCtx) return;
                let t = audioCtx.currentTime;
                
                let kickOsc = audioCtx.createOscillator();
                let kickGain = audioCtx.createGain();
                kickOsc.frequency.setValueAtTime(140, t);
                kickOsc.frequency.exponentialRampToValueAtTime(42, t + 0.12);
                kickGain.gain.setValueAtTime(0.3, t);
                kickGain.gain.exponentialRampToValueAtTime(0.01, t + 0.14);
                kickOsc.connect(kickGain); kickGain.connect(audioCtx.destination);
                kickOsc.start(t); kickOsc.stop(t + 0.15);

                if(drumStep % 2 === 0) {
                    let bassOsc = audioCtx.createOscillator();
                    let bassGain = audioCtx.createGain();
                    let bassFreq = (drumStep % 4 === 0) ? 55 : 65.4; 
                    bassOsc.type = 'triangle';
                    bassOsc.frequency.setValueAtTime(bassFreq, t);
                    bassGain.gain.setValueAtTime(0.15, t);
                    bassGain.linearRampToValueAtTime(0.01, t + 0.22);
                    bassOsc.connect(bassGain); bassGain.connect(audioCtx.destination);
                    bassOsc.start(t); bassOsc.stop(t + 0.25);
                }
                drumStep = (drumStep + 1) % 8;
            }, 300); 
        }

        function playSpikeSound() {
            if (!audioCtx || !isArenaActive) return;
            let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.25);
        }

        function playMissSound() {
            if (!audioCtx || !isArenaActive) return;
            let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(20, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }

        // --- 3. THREE.JS SCENE EXECUTION ---
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x120a1c);
        scene.fog = new THREE.FogExp2(0x120a1c, 0.025);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        targetCamPos.set(0, 7.0, 13.5);
        camera.position.copy(targetCamPos);

        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        document.body.appendChild(renderer.domElement);

        // --- 4. THE ARENA SETUP WITH STADIUM LIGHT MASTS ---
        scene.add(new THREE.AmbientLight(0x2d1738, 2.5));
        
        keyLightLeft = new THREE.SpotLight(0xfccc63, 15, 45, Math.PI/3.5, 0.5, 0.8);
        keyLightLeft.position.set(-12, 18, 6); keyLightLeft.castShadow = true; scene.add(keyLightLeft);

        keyLightRight = new THREE.SpotLight(0xe1306c, 15, 45, Math.PI/3.5, 0.5, 0.8);
        keyLightRight.position.set(12, 18, -6); keyLightRight.castShadow = true; scene.add(keyLightRight);

        const courtGeo = new THREE.BoxGeometry(18.6, 0.4, 9.6);
        const courtMat = new THREE.MeshStandardMaterial({ color: 0x1a0d26, roughness: 0.1, metalness: 0.8 });
        court = new THREE.Mesh(courtGeo, courtMat);
        court.position.y = -0.2; court.receiveShadow = true; scene.add(court);

        courtGrid = new THREE.GridHelper(18, 18, 0xe1306c, 0xfccc63);
        courtGrid.position.y = 0.03; courtGrid.scale.set(1, 1, 0.5);
        scene.add(courtGrid);

        function createPhysicalStadiumTower(x, z, colorHex) {
            const mastGroup = new THREE.Group();
            
            const poleGeo = new THREE.CylinderGeometry(0.12, 0.25, 12, 8);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x261435, metalness: 0.8, roughness: 0.2 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.y = 6;
            mastGroup.add(pole);

            const headGeo = new THREE.BoxGeometry(1.6, 0.8, 0.3);
            const headMesh = new THREE.Mesh(headGeo, poleMat);
            headMesh.position.set(0, 12, 0);
            mastGroup.add(headMesh);

            const beamGeo = new THREE.CylinderGeometry(0.1, 2.5, 20, 16, 1, true);
            const beamMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.15, side: THREE.DoubleSide });
            const beam = new THREE.Mesh(beamGeo, beamMat);
            beam.position.set(0, 2, 4);
            beam.rotation.x = Math.PI / 4.5;
            headMesh.add(beam);

            mastGroup.position.set(x, 0, z);
            mastGroup.lookAt(0, 1, 0);
            scene.add(mastGroup);
            
            lightMasts.push({ group: mastGroup, panel: headMesh, beam: beam, baseColor: colorHex });
        }
        createPhysicalStadiumTower(-11, -7, 0xfccc63);
        createPhysicalStadiumTower(11, -7, 0xe1306c);
        createPhysicalStadiumTower(-11, 7, 0xfccc63);
        createPhysicalStadiumTower(11, 7, 0xe1306c);

        netGroup = new THREE.Group();
        const postMat = new THREE.MeshStandardMaterial({ color: 0x3a1954, metalness: 0.9, roughness: 0.05 });
        const postGeo = new THREE.CylinderGeometry(0.12, 0.12, 4.5);
        const p1 = new THREE.Mesh(postGeo, postMat); p1.position.set(0, 2.25, 4.8); p1.castShadow = true;
        const p2 = new THREE.Mesh(postGeo, postMat); p2.position.set(0, 2.25, -4.8); p2.castShadow = true;
        netGroup.add(p1, p2);

        const netMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(1, 1.6), 
            new THREE.MeshStandardMaterial({ color: 0x833ab4, emissive: 0x833ab4, emissiveIntensity: 3.0, wireframe: true, side: THREE.DoubleSide })
        );
        netMesh.position.set(0, 2.7, 0); netMesh.rotation.y = Math.PI / 2; netMesh.scale.set(1, 1, 9.6);
        netGroup.add(netMesh); scene.add(netGroup);

        // --- 5. STADIUM FANS & CHEERLEADERS ---
        audienceGroup = new THREE.Group();
        const fanGeo = new THREE.CylinderGeometry(0.15, 0.05, 0.5, 5);
        const cheerleaderGeo = new THREE.ConeGeometry(0.14, 0.6, 4);

        function setupBleachers(zDirection) {
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 20; col++) {
                    const isCheerleader = (col === 2 || col === 7 || col === 12 || col === 17) && row === 0;
                    const geo = isCheerleader ? cheerleaderGeo : fanGeo;
                    
                    const color = isCheerleader ? 0xff0055 : (col % 2 === 0 ? 0xe1306c : 0xfccc63);
                    const mat = new THREE.MeshStandardMaterial({ 
                        color: color, 
                        emissive: color, 
                        emissiveIntensity: isCheerleader ? 2.5 : 0.8,
                        roughness: 0.2
                    });
                    
                    const member = new THREE.Mesh(geo, mat);
                    const posX = -8.5 + col * 0.9;
                    const posY = 0.4 + row * 0.5;
                    const posZ = (5.6 + row * 0.8) * zDirection;
                    
                    member.position.set(posX, posY, posZ);
                    if(zDirection > 0) member.rotation.y = Math.PI;
                    
                    audienceGroup.add(member);
                    audienceMembers.push({
                        mesh: member,
                        baseY: posY,
                        offset: Math.random() * Math.PI * 2,
                        speed: (isCheerleader ? 7.0 : 4.0) + Math.random() * 3.0,
                        isCheer: isCheerleader
                    });
                }
            }
        }
        setupBleachers(-1);
        setupBleachers(1);
        scene.add(audienceGroup);

        // --- 6. CHARACTER FABRICATION ---
        function createAthleticCyberPlayer(colorHex) {
            const botGroup = new THREE.Group();
            const armorMat = new THREE.MeshStandardMaterial({ color: 0x1d0f2b, metalness: 0.95, roughness: 0.05 });
            const neonMat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 4.0 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0x331949, metalness: 0.3, roughness: 0.4 });

            const pelvis = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 12), armorMat);
            pelvis.position.y = 1.1; botGroup.add(pelvis);

            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.18, 1.1, 6), armorMat);
            torso.position.y = 1.7; torso.rotation.y = Math.PI/6; botGroup.add(torso);

            const powerCore = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), neonMat);
            powerCore.position.set(0, 1.8, 0.2); botGroup.add(powerCore);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.35, 0.35), armorMat);
            head.position.y = 2.45; botGroup.add(head);
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.09, 0.2), neonMat);
            visor.position.set(0, 2.5, 0.12); botGroup.add(visor);

            const leftArm = new THREE.Group(); leftArm.position.set(-0.48, 2.1, 0);
            const lShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), neonMat); leftArm.add(lShoulder);
            const lBicep = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.06, 0.75), skinMat); lBicep.position.y = -0.35; leftArm.add(lBicep);
            botGroup.add(leftArm);
            
            const rightArm = new THREE.Group(); rightArm.position.set(0.48, 2.1, 0);
            const rShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), neonMat); rightArm.add(rShoulder);
            const rBicep = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.06, 0.75), skinMat); rBicep.position.y = -0.35; rightArm.add(rBicep);
            botGroup.add(rightArm);

            const leftLeg = new THREE.Group(); leftLeg.position.set(-0.2, 1.1, 0);
            const lThigh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.08, 0.6), armorMat); lThigh.position.y = -0.3; lThigh.rotation.z = 0.1; leftLeg.add(lThigh);
            const lShin = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.06, 0.6), neonMat); lShin.position.set(0.05, -0.8, 0); leftLeg.add(lShin);
            botGroup.add(leftLeg);

            const rightLeg = new THREE.Group(); rightLeg.position.set(0.2, 1.1, 0);
            const rThigh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.08, 0.6), armorMat); rThigh.position.y = -0.3; rThigh.rotation.z = -0.1; rightLeg.add(rThigh);
            const rShin = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.06, 0.6), neonMat); rShin.position.set(-0.05, -0.8, 0); rightLeg.add(rShin);
            botGroup.add(rightLeg);

            botGroup.traverse(child => { if(child.isMesh) { child.castShadow = true; child.receiveShadow = true; } });
            return { mesh: botGroup, lArm: leftArm, rArm: rightArm, head: head, torso: torso };
        }

        playerLeft = createAthleticCyberPlayer(0xfccc63);
        playerLeft.mesh.position.set(-5, 0, 0); playerLeft.mesh.rotation.y = Math.PI / 2; scene.add(playerLeft.mesh);

        playerRight = createAthleticCyberPlayer(0xe1306c);
        playerRight.mesh.position.set(5, 0, 0); playerRight.mesh.rotation.y = -Math.PI / 2; scene.add(playerRight.mesh);

        // --- 7. BALL & PLASMA RIGS ---
        ballGroup = new THREE.Group();
        
        ballCore = new THREE.Mesh(
            new THREE.SphereGeometry(ballRadius, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0xfd1d1d, emissive: 0xfd1d1d, emissiveIntensity: 5.0, roughness: 0.1 })
        );
        ballGroup.add(ballCore);

        const ringGeo = new THREE.TorusGeometry(ballRadius * 1.18, 0.04, 8, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        ballRing1 = new THREE.Mesh(ringGeo, ringMat); ballGroup.add(ballRing1);
        ballRing2 = new THREE.Mesh(ringGeo, ringMat); ballRing2.rotation.x = Math.PI/2; ballGroup.add(ballRing2);
        
        ballCore.castShadow = true; scene.add(ballGroup);

        hitBoxCollider = new THREE.Mesh(new THREE.SphereGeometry(ballRadius * targetFactor, 8, 8), new THREE.MeshBasicMaterial({ visible: false }));
        ballGroup.add(hitBoxCollider);

        const shockwaveGeo = new THREE.RingGeometry(0.1, 3.5, 32);
        shockwaveMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0 });
        shockwave = new THREE.Mesh(shockwaveGeo, shockwaveMat);
        shockwave.rotation.x = Math.PI / 2; scene.add(shockwave);

        particleGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        for(let i=0; i<particleCount*3; i++) positions[i] = 0;
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        particleMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.4, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
        particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleSystem);

        // --- 8. STRIKE INTERACTION & SELECTION MAPS ---
        function handleStrikeInput(clientX, clientY) {
            if (!isArenaActive) return; // Prevent play interactions before matching starts
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            if (raycaster.intersectObject(hitBoxCollider).length > 0) {
                playSpikeSound();
                cameraShakeIntensity = 0.25;

                const activeColor = ballPos.x > 0 ? 0xe1306c : 0xfccc63;

                shockwave.position.copy(ballGroup.position);
                shockwave.position.y = 0.05;
                shockwave.scale.set(0.1, 0.1, 0.1);
                shockwaveMat.opacity = 0.95;
                shockwaveMat.color.setHex(activeColor);

                const pPos = particleGeometry.attributes.position.array;
                velocities.length = 0;
                particleMaterial.color.setHex(activeColor);
                for(let i=0; i<particleCount; i++) {
                    pPos[i*3] = ballGroup.position.x; pPos[i*3+1] = ballGroup.position.y; pPos[i*3+2] = ballGroup.position.z;
                    velocities.push(new THREE.Vector3((Math.random()-0.5)*15.0, (Math.random()-0.4)*20.0, (Math.random()-0.5)*15.0));
                }
                particleGeometry.attributes.position.needsUpdate = true;
                particleMaterial.opacity = 1.0;

                baseScore++;
                if (baseScore % 3 === 0) {
                    streakMultiplier++;
                    triggerCommentary('streak');
                } else {
                    triggerCommentary('hit');
                }
                cumulativeScore += (100 * streakMultiplier);
                
                document.getElementById('score').innerText = cumulativeScore;
                document.getElementById('mult').innerText = `x${streakMultiplier}`;
                
                if(cumulativeScore > highScore) {
                    highScore = cumulativeScore;
                    document.getElementById('highscore').innerText = highScore;
                }

                ballVelocity.y = 11.0;
                ballVelocity.x = (ballPos.x > 0) ? -5.2 : 5.2;
                ballVelocity.z = (Math.random() - 0.5) * 5.5;
                
                ballCore.material.color.setHex(0xfcb045);
                ballCore.material.emissive.setHex(0xfcb045);
            }
        }

        window.addEventListener('pointerdown', (e) => { if(e.pointerType === 'mouse') handleStrikeInput(e.clientX, e.clientY); });
        window.addEventListener('touchstart', (e) => { if(e.touches.length > 0) handleStrikeInput(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });

        // --- CAMERA CYCLE OPERATION MODULE ---
        function cycleCamera() {
            currentCamMode = (currentCamMode + 1) % 3;
        }
        window.addEventListener('keydown', (e) => {
            if(e.key.toLowerCase() === 'c') cycleCamera();
        });

        function calculateTargetCameraMatrix(aspect) {
            const widthScale = aspect < 1.6 ? (1.55 / aspect) : 1.0;

            if (currentCamMode === 0) {
                targetCamPos.set(0, 7.0 * widthScale, 13.5 * widthScale);
                targetCamLookAt.set(0, 1.8, 0);
                camera.fov = aspect < 1.6 ? Math.min(85, 58 * widthScale) : dynamicFovBase;
            } 
            else if (currentCamMode === 1) {
                targetCamPos.set(ballPos.x * 0.4, 6.5 + (ballPos.y * 0.2), 12.0);
                targetCamLookAt.set(ballPos.x * 0.7, ballPos.y * 0.5, ballPos.z * 0.5);
                camera.fov = 58;
            } 
            else if (currentCamMode === 2) {
                if(ballPos.x > 0) {
                    targetCamPos.set(11.0, 5.5, ballPos.z * 0.4);
                    targetCamLookAt.set(-3.0, 1.5, 0);
                } else {
                    targetCamPos.set(-11.0, 5.5, ballPos.z * 0.4);
                    targetCamLookAt.set(3.0, 1.5, 0);
                }
                camera.fov = 60;
            }
        }

        // --- 9. UNIFORM PHYSICS & LIGHT RENDERING LOOPS ---
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = Math.min(clock.getDelta(), 0.1); 
            const elapsedTime = clock.getElapsedTime();
            const aspect = window.innerWidth / window.innerHeight;

            const fastTrackRatio = 1 - Math.exp(-9.0 * delta);
            const slowTrackRatio = 1 - Math.exp(-3.0 * delta);
            const midTrackRatio  = 1 - Math.exp(-5.4 * delta);
            const armTrackRatio  = 1 - Math.exp(-15.0 * delta);
            const armReturnRatio = 1 - Math.exp(-6.0 * delta);

            calculateTargetCameraMatrix(aspect);
            camera.position.lerp(targetCamPos, 1 - Math.exp(-6.5 * delta));
            actualCamLookAt.lerp(targetCamLookAt, 1 - Math.exp(-7.0 * delta));

            if (cameraShakeIntensity > 0) {
                camera.position.x += (Math.random() - 0.5) * cameraShakeIntensity;
                camera.position.y += (Math.random() - 0.5) * cameraShakeIntensity;
                camera.position.z += (Math.random() - 0.5) * cameraShakeIntensity;
                cameraShakeIntensity -= 0.9 * delta;
            }
            camera.lookAt(actualCamLookAt);
            camera.updateProjectionMatrix();

            audienceMembers.forEach(member => {
                const multiFactor = 1.0 + (streakMultiplier * 0.4);
                const jumpHeight = member.isCheer ? 0.35 : 0.18;
                member.mesh.position.y = member.baseY + Math.abs(Math.sin(elapsedTime * member.speed * (multiFactor * 0.7) + member.offset)) * jumpHeight * multiFactor;
                if(member.isCheer) member.mesh.rotation.z = Math.sin(elapsedTime * 10.0) * 0.2;
            });

            lightMasts.forEach((mast, index) => {
                const speedMult = 1.0 + (streakMultiplier * 0.3);
                mast.panel.rotation.y = Math.sin(elapsedTime * 2.0 * speedMult + index) * 0.25;
                
                if (streakMultiplier > 2) {
                    mast.beam.material.color.setHSL((elapsedTime * 0.15 + (index * 0.25)) % 1, 1, 0.5);
                } else {
                    mast.beam.material.color.setHex(mast.baseColor);
                }
            });

            if(shockwaveMat.opacity > 0) {
                shockwaveMat.opacity -= 2.4 * delta;
                shockwave.scale.addScalar(8.4 * delta);
            }

            if(particleMaterial.opacity > 0) {
                particleMaterial.opacity -= 1.5 * delta;
                const pPos = particleGeometry.attributes.position.array;
                for(let i=0; i<particleCount; i++) {
                    pPos[i*3] += velocities[i].x * delta; 
                    pPos[i*3+1] += velocities[i].y * delta; 
                    pPos[i*3+2] += velocities[i].z * delta;
                }
                particleGeometry.attributes.position.needsUpdate = true;
            }

            ballVelocity.y += gravity * delta;
            ballPos.x += ballVelocity.x * delta;
            ballPos.y += ballVelocity.y * delta;
            ballPos.z += ballVelocity.z * delta;

            if(ballPos.x < 0) {
                playerLeft.mesh.position.z = THREE.MathUtils.lerp(playerLeft.mesh.position.z, ballPos.z, fastTrackRatio);
                playerLeft.mesh.position.x = THREE.MathUtils.lerp(playerLeft.mesh.position.x, Math.max(-7.5, ballPos.x - 0.5), midTrackRatio);
                playerLeft.lArm.rotation.x = THREE.MathUtils.lerp(playerLeft.lArm.rotation.x, -Math.PI * 1.1, armTrackRatio);
                playerLeft.rArm.rotation.x = THREE.MathUtils.lerp(playerLeft.rArm.rotation.x, -Math.PI * 1.1, armTrackRatio);
            } else {
                playerLeft.mesh.position.z = THREE.MathUtils.lerp(playerLeft.mesh.position.z, 0, slowTrackRatio);
                playerLeft.mesh.position.x = THREE.MathUtils.lerp(playerLeft.mesh.position.x, -5.2, midTrackRatio);
                playerLeft.lArm.rotation.x = THREE.MathUtils.lerp(playerLeft.lArm.rotation.x, 0, armReturnRatio);
                playerLeft.rArm.rotation.x = THREE.MathUtils.lerp(playerLeft.rArm.rotation.x, 0, armReturnRatio);
            }

            if(ballPos.x > 0) {
                playerRight.mesh.position.z = THREE.MathUtils.lerp(playerRight.mesh.position.z, ballPos.z, fastTrackRatio);
                playerRight.mesh.position.x = THREE.MathUtils.lerp(playerRight.mesh.position.x, Math.min(7.5, ballPos.x + 0.5), midTrackRatio);
                playerRight.lArm.rotation.x = THREE.MathUtils.lerp(playerRight.lArm.rotation.x, -Math.PI * 1.1, armTrackRatio);
                playerRight.rArm.rotation.x = THREE.MathUtils.lerp(playerRight.rArm.rotation.x, -Math.PI * 1.1, armTrackRatio);
            } else {
                playerRight.mesh.position.z = THREE.MathUtils.lerp(playerRight.mesh.position.z, 0, slowTrackRatio);
                playerRight.mesh.position.x = THREE.MathUtils.lerp(playerRight.mesh.position.x, 5.2, midTrackRatio);
                playerRight.lArm.rotation.x = THREE.MathUtils.lerp(playerRight.lArm.rotation.x, 0, armReturnRatio);
                playerRight.rArm.rotation.x = THREE.MathUtils.lerp(playerRight.rArm.rotation.x, 0, armReturnRatio);
            }

            if (Math.abs(ballPos.x) < ballRadius && ballPos.y < 3.3 && ballPos.y > 1.0) {
                ballVelocity.x *= -0.7; ballPos.x = Math.sign(ballVelocity.x) * ballRadius;
            }

            if (ballPos.y <= ballRadius) {
                playMissSound();
                triggerCommentary('fault');
                baseScore = 0; streakMultiplier = 1; cumulativeScore = 0;
                document.getElementById('score').innerText = 0;
                document.getElementById('mult').innerText = "x1";
                
                ballPos.set((Math.random() > 0.5 ? 4.5 : -4.5), 6, (Math.random() - 0.5) * 2.5);
                ballVelocity.set(ballPos.x > 0 ? -4.0 : 4.0, 4.2, 0);
                ballCore.material.color.setHex(0xfd1d1d); ballCore.material.emissive.setHex(0xfd1d1d);
            }

            if (Math.abs(ballPos.z) > 4.4) ballVelocity.z *= -1;
            if (Math.abs(ballPos.x) > 8.9) ballVelocity.x *= -1;

            ballGroup.position.copy(ballPos);
            ballCore.rotation.x += 1.8 * delta; ballCore.rotation.y += 2.4 * delta;
            ballRing1.rotation.y += 3.6 * delta; ballRing2.rotation.x += 3.6 * delta;

            renderer.render(scene, camera);
        }

        // --- 10. DYNAMIC VISUAL FIELD RESPONSIVENESS ---
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            targetFactor = width < 768 ? 6.5 : 4.8;
            hitBoxCollider.geometry = new THREE.SphereGeometry(ballRadius * targetFactor, 8, 8);
            
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        window.dispatchEvent(new Event('resize'));
        animate();
    </script>
</body>
</html>
