<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Cyber Volleyball: Overdrive</title>
    
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cyber Volley">

<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b020f">
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #0b020f; 
            font-family: 'Orbitron', 'Segoe UI', system-ui, sans-serif; user-select: none;
            touch-action: none;
        }
        
        /* High-Contrast Instagram Arcade HUD */
        #hud {
            position: absolute;
            top: env(safe-area-inset-top, 20px);
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 92%;
            max-width: 600px;
            pointer-events: none;
            z-index: 10;
        }
        .hud-card {
            background: linear-gradient(135deg, rgba(20, 5, 25, 0.95) 0%, rgba(10, 2, 15, 0.98) 100%);
            border: 2px solid #E1306C;
            clip-path: polygon(10px 0%, 100% 0%, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0% 100%, 0% 10px);
            box-shadow: 0 0 25px rgba(225, 48, 108, 0.4);
            padding: 10px 8px;
            color: white;
            text-align: center;
            backdrop-filter: blur(8px);
        }
        .hud-card.high { border-color: #833AB4; box-shadow: 0 0 25px rgba(131, 58, 180, 0.4); }
        .hud-card.multiplier { border-color: #F77737; box-shadow: 0 0 25px rgba(247, 119, 55, 0.4); }
        
        .hud-label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #ffb3d1; margin-bottom: 4px; font-weight: 800; }
        .hud-value { font-size: 24px; font-weight: 900; font-family: monospace; text-shadow: 0 0 10px rgba(255,255,255,0.6); }
        
        /* Camera Control Rig Overlay */
        #camera-rig-controls {
            position: absolute;
            top: calc(env(safe-area-inset-top, 20px) + 85px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 20;
        }
        .cam-btn {
            background: rgba(15, 3, 20, 0.85);
            border: 1px solid #C13584;
            color: #fff;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(193, 53, 132, 0.2);
            transition: all 0.2s ease;
        }
        .cam-btn.active, .cam-btn:hover {
            background: linear-gradient(45deg, #E1306C, #C13584);
            border-color: #fff;
            box-shadow: 0 0 15px rgba(225, 48, 108, 0.6);
        }

        #instructions { 
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 20px) + 10px); 
            left: 50%; transform: translateX(-50%); 
            color: #F77737; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
            text-shadow: 0 0 12px rgba(247, 119, 55, 0.8); pointer-events: none; z-index: 10;
            background: rgba(15, 2, 20, 0.9); padding: 8px 20px; 
            border: 2px solid #C13584;
            border-radius: 4px; width: 85%; max-width: 360px; text-align: center;
            font-weight: 700;
        }

        #audio-prompt {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #240a2b 0%, #07010a 100%); 
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; color: white;
            padding: 20px; text-align: center;
        }
        h1 { 
            font-size: clamp(28px, 7vw, 54px); margin-bottom: 25px; letter-spacing: 6px; 
            text-shadow: 0 0 20px #E1306C, 0 0 40px #833AB4; text-transform: uppercase;
            font-weight: 900;
        }
        
        /* Upgraded Pure CSS Cyber Volleyball Animated Poster Graphic with Instagram Theme */
        .poster-art {
            width: 220px; height: 300px;
            background: radial-gradient(circle at top right, #405DE6 0%, #1c0526 100%);
            border-radius: 8px; border: 3px solid #E1306C;
            box-shadow: 0 0 35px rgba(225, 48, 108, 0.5), inset 0 0 20px rgba(131, 58, 180, 0.3); 
            margin-bottom: 35px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float 3s ease-in-out infinite;
        }
        .poster-art::before {
            content: "🏐";
            font-size: 80px;
            filter: drop-shadow(0 0 20px #E1306C) drop-shadow(0 0 40px #833AB4);
            z-index: 2;
            animation: spinBall 6s linear infinite;
        }
        /* Neon Net Background Overlay Graphic */
        .poster-art::after {
            content: "";
            position: absolute;
            width: 140%; height: 40%;
            bottom: 0; left: -20%;
            background: linear-gradient(rgba(193, 53, 132, 0) 0%, rgba(193, 53, 132, 0.4) 100%);
            border-top: 2px solid #C13584;
            box-shadow: 0 0 15px #C13584;
            transform: perspective(100px) rotateX(40deg);
            background-size: 20px 20px;
            background-image: linear-gradient(to right, rgba(225,48,108,0.5) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(225,48,108,0.5) 1px, transparent 1px);
            z-index: 1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }
        @keyframes spinBall {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.08); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .play-btn {
            background: linear-gradient(135deg, #F77737 0%, #E1306C 50%, #833AB4 100%); border: none;
            color: #fff; padding: 15px 45px; font-size: clamp(18px, 4vw, 24px); font-weight: 900;
            cursor: pointer; box-shadow: 0 0 35px rgba(225,48,108,0.6);
            text-transform: uppercase; letter-spacing: 3px;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            transition: transform 0.1s ease;
        }
        .play-btn:active { transform: scale(0.95); }
        
        @media (min-width: 768px) {
            .hud-card { padding: 14px 25px; }
            .hud-value { font-size: 32px; }
            .hud-label { font-size: 11px; }
            #instructions { font-size: 14px; width: auto; max-width: none; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="audio-prompt">
        <h1>Cyber Volleyball<br><span style="font-size:0.5em; color:#E1306C;">Overdrive</span></h1>
        <div class="poster-art"></div>
        <button class="play-btn" onclick="initGameAudio()">Enter Arena</button>
    </div>

    <div id="hud">
        <div class="hud-card">
            <div class="hud-label">Score</div>
            <div class="hud-value" id="score">0</div>
        </div>
        <div class="hud-card multiplier">
            <div class="hud-label">Multiplier</div>
            <div class="hud-value" id="mult">x1</div>
        </div>
        <div class="hud-card high">
            <div class="hud-label">Top Record</div>
            <div class="hud-value" id="highscore">0</div>
        </div>
    </div>

    <div id="camera-rig-controls">
        <button class="cam-btn active" onclick="setCameraAngle('broadcast', this)">Broadcast</button>
        <button class="cam-btn" onclick="setCameraAngle('tactical', this)">Tactical</button>
        <button class="cam-btn" onclick="setCameraAngle('action', this)">Action View</button>
    </div>
    
    <div id="instructions">Slam the ball within the target zone!</div>

    <script>
        // --- 1. GLOBAL STATE DECLARATIONS ---
        let scene, camera, renderer, originalCamPos;
        let keyLightLeft, keyLightRight, court, courtGrid;
        let netGroup, audienceGroup, audienceMembers = [];
        let playerLeft, playerRight;
        let currentCameraMode = 'broadcast';
        
        const ballRadius = 0.42;
        let ballGroup, ballCore, ballRing1, ballRing2, hitBoxCollider;
        let shockwave, shockwaveMat, particleGeometry, particleMaterial, particleSystem;
        const particleCount = 45;
        const velocities = [];

        let audioCtx, musicNode, filterNode;

        let ballPos = new THREE.Vector3(4, 5.5, 0);
        let ballVelocity = new THREE.Vector3(-4.0, 5.5, 1.0); 
        let gravity = -14.0; 
        
        let baseScore = 0, streakMultiplier = 1, cumulativeScore = 0, highScore = 0;
        let cameraShakeIntensity = 0;
        
        const clock = new THREE.Clock(); 

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let targetFactor = window.innerWidth < 768 ? 6.2 : 4.6;

        // --- 2. AUDIO SYNTH & HUMAN SPEECH COMMENTARY ENGINE ---
        function initGameAudio() {
            document.getElementById('audio-prompt').style.display = 'none';
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const bufferSize = audioCtx.sampleRate * 2; 
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                let t = i / audioCtx.sampleRate;
                data[i] = Math.sin(2 * Math.PI * 60 * t + Math.sin(2 * Math.PI * 130 * t) * 0.45) * 0.15;
                if (i % (audioCtx.sampleRate / 4) < 1800) data[i] += (Math.random() - 0.5) * 0.06;
            }

            musicNode = audioCtx.createBufferSource();
            musicNode.buffer = buffer;
            musicNode.loop = true;
            filterNode = audioCtx.createBiquadFilter();
            filterNode.type = 'lowpass';
            filterNode.frequency.setValueAtTime(1100, audioCtx.currentTime);

            musicNode.connect(filterNode);
            filterNode.connect(audioCtx.destination);
            musicNode.start();
            
            triggerCommentary("Arena initialized. Welcome to Cyber Overdrive.");
        }

        function triggerCommentary(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                const voices = window.speechSynthesis.getVoices();
                const femaleVoice = voices.find(v => v.name.includes('Female') || v.name.includes('Google US English') || v.name.includes('Zira') || v.lang.startsWith('en'));
                if (femaleVoice) utterance.voice = femaleVoice;
                utterance.pitch = 1.15;
                utterance.rate = 1.05;
                window.speechSynthesis.speak(utterance);
            }
        }

        function playSpikeSound() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.25);

            const spikes = ["Incredible spike!", "Clean smash!", "What an overdrive velocity!", "Furious hit!"];
            triggerCommentary(spikes[Math.floor(Math.random() * spikes.length)]);
        }

        function playMissSound() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(20, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);

            const misses = ["Point missed!", "Fault on court!", "Resetting parameters.", "Ball dropped!"];
            triggerCommentary(misses[Math.floor(Math.random() * misses.length)]);
        }

        // --- 3. INTERACTIVE CAMERA SWITCH CONTROL ---
        function setCameraAngle(mode, element) {
            currentCameraMode = mode;
            document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
            if(element) element.classList.add('active');
            
            if (mode === 'broadcast') {
                originalCamPos.set(0, 7.0, 13.5);
            } else if (mode === 'tactical') {
                originalCamPos.set(0, 15.0, 0.1);
            } else if (mode === 'action') {
                originalCamPos.set(-6.0, 4.5, 9.0);
            }
        }

        // --- 4. THREE.JS SCENE EXECUTION ---
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0212);
        scene.fog = new THREE.FogExp2(0x0a0212, 0.025);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        originalCamPos = new THREE.Vector3(0, 7.0, 13.5);
        camera.position.copy(originalCamPos);

        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        document.body.appendChild(renderer.domElement);

        // --- 5. THE INSTAGRAM ARENA SETUP ---
        scene.add(new THREE.AmbientLight(0x200a2b, 2.5)); 
        
        keyLightLeft = new THREE.SpotLight(0xE1306C, 15, 45, Math.PI/3.5, 0.5, 0.8); 
        keyLightLeft.position.set(-12, 18, 6); keyLightLeft.castShadow = true; scene.add(keyLightLeft);

        keyLightRight = new THREE.SpotLight(0x833AB4, 15, 45, Math.PI/3.5, 0.5, 0.8); 
        keyLightRight.position.set(12, 18, -6); keyLightRight.castShadow = true; scene.add(keyLightRight);

        const courtGeo = new THREE.BoxGeometry(18.6, 0.4, 9.6); 
        const courtMat = new THREE.MeshStandardMaterial({ color: 0x14041a, roughness: 0.1, metalness: 0.9 }); 
        court = new THREE.Mesh(courtGeo, courtMat);
        court.position.y = -0.2; court.receiveShadow = true; scene.add(court);

        courtGrid = new THREE.GridHelper(18, 18, 0xE1306C, 0xF77737); 
        courtGrid.position.y = 0.03; courtGrid.scale.set(1, 1, 0.5);
        scene.add(courtGrid);

        function createLightTower(x, z, color) {
            const tower = new THREE.Group();
            const beamGeo = new THREE.CylinderGeometry(0.1, 1.5, 18, 16, 1, true);
            const beamMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.15, side: THREE.DoubleSide });
            const beam = new THREE.Mesh(beamGeo, beamMat);
            beam.position.y = 9; beam.rotation.z = x > 0 ? -0.12 : 0.12;
            tower.add(beam);
            tower.position.set(x, 0, z);
            scene.add(tower);
        }
        createLightTower(-11, -7, 0xE1306C);
        createLightTower(11, -7, 0x833AB4);

        netGroup = new THREE.Group();
        const postMat = new THREE.MeshStandardMaterial({ color: 0x1a0526, metalness: 0.9, roughness: 0.05 }); 
        const postGeo = new THREE.CylinderGeometry(0.12, 0.12, 4.5);
        const p1 = new THREE.Mesh(postGeo, postMat); p1.position.set(0, 2.25, 4.8); p1.castShadow = true;
        const p2 = new THREE.Mesh(postGeo, postMat); p2.position.set(0, 2.25, -4.8); p2.castShadow = true;
        netGroup.add(p1, p2);

        const netMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(1, 1.6), 
            new THREE.MeshStandardMaterial({ color: 0xC13584, emissive: 0xC13584, emissiveIntensity: 3.0, wireframe: true, side: THREE.DoubleSide })
        );
        netMesh.position.set(0, 2.7, 0); netMesh.rotation.y = Math.PI / 2; netMesh.scale.set(1, 1, 9.6);
        netGroup.add(netMesh); scene.add(netGroup);

        // --- 6. DOUBLE-SIDED CYBER FANS ---
        audienceGroup = new THREE.Group();
        const audGeo = new THREE.CylinderGeometry(0.15, 0.05, 0.6, 4);
        
        for (let i = 0; i < 48; i++) {
            const color = i % 2 === 0 ? 0xE1306C : 0xF77737;
            const audMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.5, wireframe: true });
            const member = new THREE.Mesh(audGeo, audMat);
            
            const row = i % 2;
            const col = Math.floor((i % 24) / 2);
            const sideZ = i < 24 ? (-5.5 - row * 0.6) : (5.5 + row * 0.6);
            
            member.position.set(-8.5 + col * 0.75, 0.6 + row * 0.4, sideZ);
            
            audienceGroup.add(member);
            audienceMembers.push({
                mesh: member,
                baseY: member.position.y,
                offset: Math.random() * Math.PI * 2,
                speed: 4 + Math.random() * 4
            });
        }
        scene.add(audienceGroup);

        // --- 7. CHARACTER FABRICATION ---
        function createAthleticCyberPlayer(colorHex) {
            const botGroup = new THREE.Group();
            const armorMat = new THREE.MeshStandardMaterial({ color: 0x12031a, metalness: 0.95, roughness: 0.05 }); 
            const neonMat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 4.0 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0x2b0f3d, metalness: 0.3, roughness: 0.4 }); 

            const pelvis = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 12), armorMat);
            pelvis.position.y = 1.1; botGroup.add(pelvis);

            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.18, 1.1, 6), armorMat);
            torso.position.y = 1.7; torso.rotation.y = Math.PI/6; botGroup.add(torso);

            const powerCore = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), neonMat);
            powerCore.position.set(0, 1.8, 0.2); botGroup.add(powerCore);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.35, 0.35), armorMat);
            head.position.y = 2.45; botGroup.add(head);
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.09, 0.2), neonMat);
            visor.position.set(0, 2.5, 0.12); botGroup.add(visor);

            const leftArm = new THREE.Group(); leftArm.position.set(-0.48, 2.1, 0);
            const lShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), neonMat); leftArm.add(lShoulder);
            const lBicep = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.06, 0.75), skinMat); lBicep.position.y = -0.35; leftArm.add(lBicep);
            botGroup.add(leftArm);
            
            const rightArm = new THREE.Group(); rightArm.position.set(0.48, 2.1, 0);
            const rShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), neonMat); rightArm.add(rShoulder);
            const rBicep = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.06, 0.75), skinMat); rBicep.position.y = -0.35; rightArm.add(rBicep);
            botGroup.add(rightArm);

            const leftLeg = new THREE.Group(); leftLeg.position.set(-0.2, 1.1, 0);
            const lThigh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.08, 0.6), armorMat); lThigh.position.y = -0.3; lThigh.rotation.z = 0.1; leftLeg.add(lThigh);
            const lShin = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.06, 0.6), neonMat); lShin.position.set(0.05, -0.8, 0); leftLeg.add(lShin);
            botGroup.add(leftLeg);

            const rightLeg = new THREE.Group(); rightLeg.position.set(0.2, 1.1, 0);
            const rThigh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.08, 0.6), armorMat); rThigh.position.y = -0.3; rThigh.rotation.z = -0.1; rightLeg.add(rThigh);
            const rShin = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.06, 0.6), neonMat); rShin.position.set(-0.05, -0.8, 0); rightLeg.add(rShin);
            botGroup.add(rightLeg);

            botGroup.traverse(child => { if(child.isMesh) { child.castShadow = true; child.receiveShadow = true; } });
            return { mesh: botGroup, lArm: leftArm, rArm: rightArm, head: head, torso: torso };
        }

        playerLeft = createAthleticCyberPlayer(0xE1306C);
        playerLeft.mesh.position.set(-5, 0, 0); playerLeft.mesh.rotation.y = Math.PI / 2; scene.add(playerLeft.mesh);

        playerRight = createAthleticCyberPlayer(0x833AB4);
        playerRight.mesh.position.set(5, 0, 0); playerRight.mesh.rotation.y = -Math.PI / 2; scene.add(playerRight.mesh);

        // --- 8. BALL & PLASMA RIGS ---
        ballGroup = new THREE.Group();
        
        ballCore = new THREE.Mesh(
            new THREE.SphereGeometry(ballRadius, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0xF77737, emissive: 0xE1306C, emissiveIntensity: 5.0, roughness: 0.1 })
        );
        ballGroup.add(ballCore);

        const ringGeo = new THREE.TorusGeometry(ballRadius * 1.18, 0.04, 8, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        ballRing1 = new THREE.Mesh(ringGeo, ringMat); ballGroup.add(ballRing1);
        ballRing2 = new THREE.Mesh(ringGeo, ringMat); ballRing2.rotation.x = Math.PI/2; ballGroup.add(ballRing2);
        
        ballCore.castShadow = true; scene.add(ballGroup);

        hitBoxCollider = new THREE.Mesh(new THREE.SphereGeometry(ballRadius * targetFactor, 8, 8), new THREE.MeshBasicMaterial({ visible: false }));
        ballGroup.add(hitBoxCollider);

        const shockwaveGeo = new THREE.RingGeometry(0.1, 3.5, 32);
        shockwaveMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0 });
        shockwave = new THREE.Mesh(shockwaveGeo, shockwaveMat);
        shockwave.rotation.x = Math.PI / 2; scene.add(shockwave);

        particleGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        for(let i=0; i<particleCount*3; i++) positions[i] = 0;
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        particleMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.4, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
        particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleSystem);

        // --- 9. STRIKE INTERACTION ---
        function handleStrikeInput(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            if (raycaster.intersectObject(hitBoxCollider).length > 0) {
                playSpikeSound();
                cameraShakeIntensity = 0.25;

                const activeColor = ballPos.x > 0 ? 0x833AB4 : 0xE1306C;

                shockwave.position.copy(ballGroup.position);
                shockwave.position.y = 0.05;
                shockwave.scale.set(0.1, 0.1, 0.1);
                shockwaveMat.opacity = 0.95;
                shockwaveMat.color.setHex(activeColor);

                const pPos = particleGeometry.attributes.position.array;
                velocities.length = 0;
                particleMaterial.color.setHex(activeColor);
                for(let i=0; i<particleCount; i++) {
                    pPos[i*3] = ballGroup.position.x; pPos[i*3+1] = ballGroup.position.y; pPos[i*3+2] = ballGroup.position.z;
                    velocities.push(new THREE.Vector3((Math.random()-0.5)*15.0, (Math.random()-0.4)*20.0, (Math.random()-0.5)*15.0));
                }
                particleGeometry.attributes.position.needsUpdate = true;
                particleMaterial.opacity = 1.0;

                baseScore++;
                if (baseScore % 3 === 0) streakMultiplier++;
                cumulativeScore += (100 * streakMultiplier);
                
                document.getElementById('score').innerText = cumulativeScore;
                document.getElementById('mult').innerText = `x${streakMultiplier}`;
                
                if(cumulativeScore > highScore) {
                    highScore = cumulativeScore;
                    document.getElementById('highscore').innerText = highScore;
                }

                ballVelocity.y = 11.0;
                ballVelocity.x = (ballPos.x > 0) ? -5.2 : 5.2;
                ballVelocity.z = (Math.random() - 0.5) * 5.5;
                
                ballCore.material.color.setHex(0xF77737);
                ballCore.material.emissive.setHex(0xE1306C);
            }
        }

        window.addEventListener('pointerdown', (e) => { if(e.pointerType === 'mouse') handleStrikeInput(e.clientX, e.clientY); });
        window.addEventListener('touchstart', (e) => { if(e.touches.length > 0) handleStrikeInput(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });

        // --- 10. UNIFORM PHYSICS LOOPS ---
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = Math.min(clock.getDelta(), 0.1); 
            const elapsedTime = clock.getElapsedTime();

            const fastTrackRatio = 1 - Math.exp(-9.0 * delta);
            const slowTrackRatio = 1 - Math.exp(-3.0 * delta);
            const midTrackRatio  = 1 - Math.exp(-5.4 * delta);
            const armTrackRatio  = 1 - Math.exp(-15.0 * delta);
            const armReturnRatio = 1 - Math.exp(-6.0 * delta);

            audienceMembers.forEach(member => {
                const cheerIntensity = streakMultiplier > 1 ? 1.8 : 1.0;
                member.mesh.position.y = member.baseY + Math.sin(elapsedTime * member.speed + member.offset) * 0.15 * cheerIntensity;
            });

            if(shockwaveMat.opacity > 0) {
                shockwaveMat.opacity -= 2.4 * delta;
                shockwave.scale.addScalar(8.4 * delta);
            }

            if(particleMaterial.opacity > 0) {
                particleMaterial.opacity -= 1.5 * delta;
                const pPos = particleGeometry.attributes.position.array;
                for(let i=0; i<particleCount; i++) {
                    pPos[i*3] += velocities[i].x * delta; 
                    pPos[i*3+1] += velocities[i].y * delta; 
                    pPos[i*3+2] += velocities[i].z * delta;
                }
                particleGeometry.attributes.position.needsUpdate = true;
            }

            if (cameraShakeIntensity > 0) {
                camera.position.set(
                    originalCamPos.x + (Math.random() - 0.5) * cameraShakeIntensity,
                    originalCamPos.y + (Math.random() - 0.5) * cameraShakeIntensity,
                    originalCamPos.z + (Math.random() - 0.5) * cameraShakeIntensity
                );
                cameraShakeIntensity -= 0.9 * delta;
            } else {
                if (currentCameraMode === 'action') {
                    camera.position.x = THREE.MathUtils.lerp(camera.position.x, ballPos.x * 0.4 - 5, fastTrackRatio);
                } else {
                    camera.position.copy(originalCamPos);
                }
            }
            
            if (currentCameraMode === 'tactical') {
                camera.lookAt(0, 0, 0);
            } else {
                camera.lookAt(0, 1.8, 0);
            }

            ballVelocity.y += gravity * delta;
            ballPos.x += ballVelocity.x * delta;
            ballPos.y += ballVelocity.y * delta;
            ballPos.z += ballVelocity.z * delta;

            if(ballPos.x < 0) {
                playerLeft.mesh.position.z = THREE.MathUtils.lerp(playerLeft.mesh.position.z, ballPos.z, fastTrackRatio);
                playerLeft.mesh.position.x = THREE.MathUtils.lerp(playerLeft.mesh.position.x, Math.max(-7.5, ballPos.x - 0.5), midTrackRatio);
                playerLeft.lArm.rotation.x = THREE.MathUtils.lerp(playerLeft.lArm.rotation.x, -Math.PI * 1.1, armTrackRatio);
                playerLeft.rArm.rotation.x = THREE.MathUtils.lerp(playerLeft.rArm.rotation.x, -Math.PI * 1.1, armTrackRatio);
            } else {
                playerLeft.mesh.position.z = THREE.MathUtils.lerp(playerLeft.mesh.position.z, 0, slowTrackRatio);
                playerLeft.mesh.position.x = THREE.MathUtils.lerp(playerLeft.mesh.position.x, -5.2, midTrackRatio);
                playerLeft.lArm.rotation.x = THREE.MathUtils.lerp(playerLeft.lArm.rotation.x, 0, armReturnRatio);
                playerLeft.rArm.rotation.x = THREE.MathUtils.lerp(playerLeft.rArm.rotation.x, 0, armReturnRatio);
            }

            if(ballPos.x > 0) {
                playerRight.mesh.position.z = THREE.MathUtils.lerp(playerRight.mesh.position.z, ballPos.z, fastTrackRatio);
                playerRight.mesh.position.x = THREE.MathUtils.lerp(playerRight.mesh.position.x, Math.min(7.5, ballPos.x + 0.5), midTrackRatio);
                playerRight.lArm.rotation.x = THREE.MathUtils.lerp(playerRight.lArm.rotation.x, -Math.PI * 1.1, armTrackRatio);
                playerRight.rArm.rotation.x = THREE.MathUtils.lerp(playerRight.rArm.rotation.x, -Math.PI * 1.1, armTrackRatio);
            } else {
                playerRight.mesh.position.z = THREE.MathUtils.lerp(playerRight.mesh.position.z, 0, slowTrackRatio);
                playerRight.mesh.position.x = THREE.MathUtils.lerp(playerRight.mesh.position.x, 5.2, midTrackRatio);
                playerRight.lArm.rotation.x = THREE.MathUtils.lerp(playerRight.lArm.rotation.x, 0, armReturnRatio);
                playerRight.rArm.rotation.x = THREE.MathUtils.lerp(playerRight.rArm.rotation.x, 0, armReturnRatio);
            }

            if (Math.abs(ballPos.x) < ballRadius && ballPos.y < 3.3 && ballPos.y > 1.0) {
                ballVelocity.x *= -0.7; ballPos.x = Math.sign(ballVelocity.x) * ballRadius;
            }

            if (ballPos.y <= ballRadius) {
                playMissSound();
                baseScore = 0; streakMultiplier = 1; cumulativeScore = 0;
                document.getElementById('score').innerText = 0;
                document.getElementById('mult').innerText = "x1";

                ballPos.set((Math.random() > 0.5 ? 4.5 : -4.5), 6, (Math.random() - 0.5) * 2.5);
                ballVelocity.set(ballPos.x > 0 ? -4.0 : 4.0, 4.2, 0);
                ballCore.material.color.setHex(0xF77737); ballCore.material.emissive.setHex(0xE1306C);
            }

            if (Math.abs(ballPos.z) > 4.4) ballVelocity.z *= -1;
            if (Math.abs(ballPos.x) > 8.9) ballVelocity.x *= -1;

            ballGroup.position.copy(ballPos);
            
            ballCore.rotation.x += 1.8 * delta; ballCore.rotation.y += 2.4 * delta;
            ballRing1.rotation.y += 3.6 * delta; ballRing2.rotation.x += 3.6 * delta;

            renderer.render(scene, camera);
        }

        // --- 11. WINDOW RESIZING GRAPHICS RATIO ---
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            camera.aspect = width / height;
            
            if(width < 768) {
                camera.fov = 76; 
                if(currentCameraMode === 'broadcast') {
                    camera.position.set(0, 8.0, 15.0);
                    originalCamPos.set(0, 8.0, 15.0);
                }
                hitBoxCollider.geometry = new THREE.SphereGeometry(ballRadius * 6.2, 8, 8); 
            } else {
                camera.fov = 60;
                if(currentCameraMode === 'broadcast') {
                    camera.position.set(0, 7.0, 13.5);
                    originalCamPos.set(0, 7.0, 13.5);
                }
                hitBoxCollider.geometry = new THREE.SphereGeometry(ballRadius * 4.6, 8, 8);
            }
            
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        window.dispatchEvent(new Event('resize'));
        animate();
    </script>
</body>
</html>
