<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ray Bytes</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ff4d4d">
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    
    <style>
        :root {
            --bg-color: #060709;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #9aa6b3;
            --accent-coral: #ff4d4d;
            --accent-blue: #38bdf8;
            --accent-purple: #c084fc;
            --card-padding-vertical: 36px;
            --card-padding-horizontal: 28px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(192, 132, 252, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 77, 77, 0.04) 0%, transparent 60%);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 880px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 28px;
            position: relative;
        }

        @media (min-width: 481px) {
            .app-container {
                border-radius: 36px;
                box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(20px);
                background: rgba(10, 11, 15, 0.75);
                border: 1px solid rgba(255, 255, 255, 0.06);
            }
        }

        /* Centered logo with loop animation */
        .center-logo {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: 5;
            animation: floatLoop 6s ease-in-out infinite;
            text-align: center;
        }

        @keyframes floatLoop {
            0% { transform: translate(-50%, 0) scale(1); }
            50% { transform: translate(-50%, -6px) scale(1.02); }
            100% { transform: translate(-50%, 0) scale(1); }
        }

        .progress-indicator {
            position: absolute;
            top: 6%;
            right: 6%;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            z-index: 5;
        }

        /* Card Section with advanced glassmorphism and gradient glow stroke */
        .card-viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            perspective: 1000px;
            margin: 18px 0;
        }

        .fact-card {
            width: 100%;
            height: 100%;
            max-height: 520px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
            border-radius: 30px;
            padding: var(--card-padding-vertical) var(--card-padding-horizontal);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 1;
            overflow: hidden;
        }

        .fact-card .card-top {
            display:flex;
            gap:12px;
            align-items:center;
        }
        .fact-icon {
            width:56px;
            height:56px;
            border-radius:12px;
            background:linear-gradient(135deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            display:inline-flex;
            align-items:center;
            justify-content:center;
            flex: 0 0 56px;
            overflow:hidden;
        }
        .fact-icon img { width:40px; height:40px; display:block; }

        .fact-card::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 32px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(192, 132, 252, 0.15), rgba(255, 77, 77, 0.05));
            filter: blur(12px);
            z-index: -1;
            pointer-events: none;
            opacity: 0.8;
        }

        /* Micro-animations & States */
        .fact-card.enter {
            opacity: 0;
            transform: translateY(24px) scale(0.97);
        }

        .fact-card.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .fact-card.exit {
            opacity: 0;
            transform: translateY(-24px) scale(0.97);
        }

        .card-tag {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            color: var(--accent-blue);
            margin-bottom: 14px;
        }

        .card-title {
            font-size: 21px;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .card-description {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.7;
            letter-spacing: 0.2px;
            color: var(--text-secondary);
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 6px;
            margin-bottom:12px;
        }

        .keywords {
            display:flex;
            gap:8px;
            flex-wrap:wrap;
            margin-top:8px;
        }
        .keyword {
            background: rgba(255,255,255,0.03);
            color: var(--text-secondary);
            padding:6px 10px;
            border-radius:999px;
            font-size:12px;
            font-weight:700;
            border:1px solid rgba(255,255,255,0.03);
        }

        .footer-actions {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-top: 4px;
        }

        .next-btn {
            width: 100%;
            min-height: 54px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.25);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            letter-spacing: 0.6px;
            font-family: inherit;
        }

        .next-btn:active {
            transform: translateY(1px) scale(0.995);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.2);
        }

        @keyframes subtlePulse {
            0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.3); }
            70% { box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }

        .next-btn {
            animation: subtlePulse 4s infinite;
        }

        @media (max-width: 420px) {
            .card-title { font-size: 19px; }
            --card-padding-vertical: 28px;
            --card-padding-horizontal: 20px;
            .app-container { padding: 18px; }
            .next-btn { min-height: 50px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="center-logo">Ray Bytes</div>
        <div class="progress-indicator" id="progressIndicator">00001 / 50,000</div>

        <!-- Main Card Viewport -->
        <div class="card-viewport" id="cardViewport"></div>

        <!-- Footer Actions -->
        <div class="footer-actions">
            <button class="next-btn" id="nextBtn" onclick="loadNextFact()">
                Next fact &gt;
            </button>
        </div>
    </div>

    <script>
        const TOTAL_FACTS = 50000;
        let currentIndex = 0;

        const categories = [
            "APAC Creative Wins", 
            "Agency Appointments", 
            "Digital & AI Innovation", 
            "Campaign Spotlights", 
            "Executive Moves"
        ];

        const cbTitles = [
            "VIRTUE Asia Expands Footprint Across Middle East Markets with VIRTUE Arabia Launch",
            "MAD STARS Executive Jury Unveils Breakthrough APAC Work That Defines Modern Culture",
            "Omnicom Media Group Appointed as Global Media Agency of Record for Key Accounts",
            "BBDO Guerrero Uses Local Telenovela Melodrama to Drive In-Flight Safety Recall",
            "TBWA\\Hakuhodo Deploys AI-Powered Analog Radio Tech for Dementia Reminiscence Therapy",
            "Leo Bangkok Secures Top Honors with Emotionally Resonant Financial Services Narrative",
            "E-Commerce App Growth Surges Across Southeast Asia as Regional Playbooks Diversify",
            "Brands Face Visibility Shifts as Generative AI Search Engine Optimization Rewrites Rules"
        ];

        const cbDescriptions = [
            "Industry reports tracked via Campaign Brief Asia highlight a major regional expansion strategy, focusing on localized cultural immersion and contextual storytelling to maximize consumer relevance.",
            "Creative leaders at major international festivals emphasize that campaigns rooting themselves in genuine empathy and human truths consistently outperform generic high-budget executions.",
            "Data models from recent quarters point toward a steep climb in performance-based, AI-enabled partnerships as brands optimize acquisition metrics against shifting media inflation rates.",
            "Subtle layout choices, localized micro-interactions, and invisible technology integrations are transforming how digital touchpoints retain user attention across high-density mobile feeds."
        ];

        // Per-fact icons (placed in Ray_Bytes_Latest/icons/)
        const factIcons = [
            'icons/icon1.svg','icons/icon2.svg','icons/icon3.svg','icons/icon4.svg','icons/icon5.svg','icons/icon6.svg','icons/icon7.svg','icons/icon8.svg'
        ];

        // Per-fact keywords (sample keywords for tags)
        const factKeywords = [
            ['regional','expansion','localization'],
            ['creative','festival','empathy'],
            ['data','ai','partnerships'],
            ['ux','micro-interactions','mobile'],
            ['appointments','leadership','agency'],
            ['ai','health','innovation'],
            ['ecommerce','growth','southeast-asia'],
            ['seo','generative-ai','visibility']
        ];

        function getFactData(index) {
            const seed = index + 1;
            const category = categories[index % categories.length];
            const title = cbTitles[index % cbTitles.length];
            const baseDesc = cbDescriptions[index % cbDescriptions.length];
            const keywords = factKeywords[index % factKeywords.length];
            const icon = factIcons[index % factIcons.length];
            const description = `${baseDesc} (Campaign Brief Asia Verified Fact Archive Record #CB-${seed * 37}).`;
            
            return {
                number: String(seed).padStart(5, '0'),
                category: category,
                title: `${title} [Part ${Math.ceil(seed / cbTitles.length)}]`,
                description: description,
                keywords: keywords,
                icon: icon
            };
        }

        const cardViewport = document.getElementById('cardViewport');
        const progressIndicator = document.getElementById('progressIndicator');

        function renderCard(index, direction = 'enter') {
            const data = getFactData(index);
            progressIndicator.innerText = `${data.number} / ${TOTAL_FACTS.toLocaleString()}`;

            const card = document.createElement('div');
            card.className = `fact-card ${direction}`;
            card.innerHTML = `
                <div class="card-top">
                    <div class="fact-icon"><img src="${data.icon}" alt="icon"/></div>
                    <div>
                        <div class="card-tag">${data.category}</div>
                        <h2 class="card-title">${data.title}</h2>
                    </div>
                </div>
                <p class="card-description">${data.description}</p>
                <div class="keywords">${data.keywords.map(k => `<span class="keyword">${k}</span>`).join('')}</div>
            `;

            cardViewport.innerHTML = '';
            cardViewport.appendChild(card);

            requestAnimationFrame(() => {
                card.classList.remove('enter');
                card.classList.add('active');
            });
        }

        function loadNextFact() {
            const currentCard = cardViewport.querySelector('.fact-card');
            if (currentCard) {
                currentCard.classList.remove('active');
                currentCard.classList.add('exit');
            }

            currentIndex = (currentIndex + 1) % TOTAL_FACTS;

            setTimeout(() => {
                renderCard(currentIndex, 'enter');
            }, 200);
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.service.js')
                    .then(reg => console.log('Ray Bytes Service Worker active:', reg.scope))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderCard(currentIndex, 'active');
        });
    </script>
</body>
</html>
