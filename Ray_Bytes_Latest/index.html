<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ray Bytes</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#060709">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #060709;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-coral: #ff4d4d;
            --accent-blue: #38bdf8;
            --accent-purple: #c084fc;
            --card-padding-vertical: 32px;
            --card-padding-horizontal: 28px;
        }

        /* Use Inter explicitly across the app */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: auto;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(192, 132, 252, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(255, 77, 77, 0.05) 0%, transparent 65%);
            -webkit-font-smoothing: antialiased;
            -webkit-overflow-scrolling: touch;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            position: relative;
        }

        /* Larger devices (tablets / small desktops) */
        @media (min-width: 768px) {
            .app-container {
                max-width: 720px;
                min-height: 88vh;
                border-radius: 36px;
                box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.12);
                backdrop-filter: blur(24px);
                background: rgba(10, 11, 15, 0.7);
                border: 1px solid rgba(255, 255, 255, 0.08);
                padding: 28px;
            }
        }

        @media (min-width: 1024px) {
            .app-container { max-width: 900px; }
        }

        /* Header Section */
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            z-index: 10;
            padding-top: 4px;
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-svg {
            width: 36px;
            height: 36px;
            display: block;
            flex-shrink: 0;
        }

        .logo-spiral {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke: url(#rg);
            transform-origin: 50% 50%;
            animation: spin 12s linear infinite, dash 4s ease-in-out infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        @keyframes dash {
            0%   { stroke-dasharray: 4, 200; stroke-dashoffset: 0; }
            50%  { stroke-dasharray: 90, 200; stroke-dashoffset: -35; }
            100% { stroke-dasharray: 4, 200; stroke-dashoffset: -200; }
        }

        .logo-text {
            font-weight: 900;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            font-size: 16px;
            line-height: 1;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Card Section */
        .card-viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            perspective: 1000px;
            margin: 20px 0;
        }

        .fact-card {
            width: 100%;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
            border-radius: 28px;
            padding: var(--card-padding-vertical) var(--card-padding-horizontal);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.56);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; /* changed to relative for better small-screen behavior */
            max-height: 78vh;
        }

        /* On larger viewports keep absolute centering for the original visual effect */
        @media (min-width: 768px) {
            .fact-card { position: absolute; height: 100%; }
        }

        .fact-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple), var(--accent-coral));
        }

        .fact-card.enter {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }

        .fact-card.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .fact-card.exit {
            opacity: 0;
            transform: translateY(-30px) scale(0.95);
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 12px;
        }

        .fact-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(192, 132, 252, 0.15));
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--accent-blue);
        }

        .fact-icon svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-meta {
            display: flex;
            flex-direction: column;
        }

        .card-tag {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-blue);
            margin-bottom: 4px;
        }

        .card-title {
            font-size: clamp(16px, 2.8vw, 20px);
            font-weight: 800;
            line-height: 1.35;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .card-description {
            font-size: clamp(13px, 2.2vw, 15px);
            font-weight: 400;
            line-height: 1.6;
            color: var(--text-secondary);
            overflow-y: auto;
            flex-grow: 1;
            margin: 12px 0;
            padding-right: 6px;
            max-height: calc(78vh - 200px);
        }

        .keywords {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .keyword {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s ease, color 0.2s ease;
        }

        .keyword:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        /* Footer Actions */
        .footer-actions {
            width: 100%;
            margin-top: 12px;
        }

        .next-btn {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.3);
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: 0.5px;
        }

        .next-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 30px -5px rgba(56, 189, 248, 0.4);
        }

        .next-btn:active {
            transform: translateY(1px);
            box-shadow: 0 5px 15px -5px rgba(56, 189, 248, 0.2);
        }

        .next-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.2s ease;
        }

        .next-btn:hover svg {
            transform: translateX(3px);
        }

        /* Small devices adjustments */
        @media (max-width: 420px) {
            :root { --card-padding-vertical: 22px; --card-padding-horizontal: 18px; }
            .logo-text { font-size: 14px; }
            .fact-icon { width: 44px; height: 44px; }
            .card-description { max-height: calc(70vh - 160px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .logo-spiral { animation: none; }
            .fact-card { transition: opacity 0.2s ease; }
            .next-btn { transition: none; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header-bar">
            <div class="logo-wrap">
                <svg class="logo-svg" viewBox="0 0 100 100" role="img" aria-label="Ray Bytes Logo">
                    <defs>
                        <linearGradient id="rg" x1="0" x2="1" y1="0" y2="1">
                            <stop offset="0%" stop-color="#38bdf8"/>
                            <stop offset="100%" stop-color="#c084fc"/>
                        </linearGradient>
                    </defs>
                    <path class="logo-spiral" d="M50 50 m-20 0 a20 20 0 1 0 40 0 a16 16 0 1 1 -32 0 a12 12 0 1 0 24 0 a8 8 0 1 1 -16 0 a4 4 0 1 0 8 0"/>
                </svg>
                <div class="logo-text">Ray<span>Bytes</span></div>
            </div>
            <!-- Progress numbers removed intentionally to keep UI clean on all devices -->
        </header>

        <main class="card-viewport" id="cardViewport"></main>

        <footer class="footer-actions">
            <button class="next-btn" id="nextBtn" onclick="loadNextFact()">
                <span>Next Fact</span>
                <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </footer>
    </div>

    <script>
        const TOTAL_FACTS = 50000;
        let currentIndex = 0;

        const categories = [
            "APAC Creative Wins", 
            "Agency Appointments", 
            "Digital & AI Innovation", 
            "Campaign Spotlights", 
            "Executive Moves"
        ];

        const cbTitles = [
            "VIRTUE Asia Expands Footprint Across Middle East Markets with VIRTUE Arabia Launch",
            "MAD STARS Executive Jury Unveils Breakthrough APAC Work That Defines Modern Culture",
            "Omnicom Media Group Appointed as Global Media Agency of Record for Key Accounts",
            "BBDO Guerrero Uses Local Telenovela Melodrama to Drive In-Flight Safety Recall",
            "TBWA\\Hakuhodo Deploys AI-Powered Analog Radio Tech for Dementia Reminiscence Therapy",
            "Leo Bangkok Secures Top Honors with Emotionally Resonant Financial Services Narrative",
            "E-Commerce App Growth Surges Across Southeast Asia as Regional Playbooks Diversify",
            "Brands Face Visibility Shifts as Generative AI Search Engine Optimization Rewrites Rules"
        ];

        const cbDescriptions = [
            "Industry reports tracked via Campaign Brief Asia highlight a major regional expansion strategy, focusing on localized cultural immersion and contextual storytelling to maximize audience r[...]",
            "Creative leaders at major international festivals emphasize that campaigns rooting themselves in genuine empathy and human truths consistently outperform generic high-budget executions in[...]",
            "Data models from recent quarters point toward a steep climb in performance-based, AI-enabled partnerships as brands optimize acquisition metrics against shifting media inflation rates acr[...]",
            "Subtle layout choices, localized micro-interactions, and invisible technology integrations are transforming how digital touchpoints retain user attention across high-density mobile framew[...]"
        ];

        // Inline SVG paths for built-in icons without external dependencies
        const svgIcons = [
            '<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>',
            '<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>',
            '<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>',
            '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9"></path></svg>',
            '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polygon points="12 6 12 12 16 14"></polygon></svg>'
        ];

        const factKeywords = [
            ['regional', 'expansion', 'localization'],
            ['creative', 'festival', 'empathy'],
            ['data', 'ai', 'partnerships'],
            ['ux', 'micro-interactions', 'mobile'],
            ['appointments', 'leadership', 'agency'],
            ['ai', 'health', 'innovation'],
            ['ecommerce', 'growth', 'southeast-asia'],
            ['seo', 'generative-ai', 'visibility']
        ];

        function getFactData(index) {
            const seed = index + 1;
            const category = categories[index % categories.length];
            const title = cbTitles[index % cbTitles.length];
            const baseDesc = cbDescriptions[index % cbDescriptions.length];
            const keywords = factKeywords[index % factKeywords.length];
            const iconSvg = svgIcons[index % svgIcons.length];
            const description = `${baseDesc} (Campaign Brief Asia Verified Fact Archive Record #CB-${seed * 37}).`;
            
            return {
                // number removed from UI to keep the layout numberless
                category: category,
                title: title,
                description: description,
                keywords: keywords,
                iconSvg: iconSvg
            };
        }

        const cardViewport = document.getElementById('cardViewport');

        function renderCard(index, direction = 'enter') {
            const data = getFactData(index);

            const card = document.createElement('div');
            card.className = `fact-card ${direction}`;
            card.innerHTML = `
                <div>
                    <div class="card-top">
                        <div class="fact-icon">${data.iconSvg}</div>
                        <div class="card-meta">
                            <div class="card-tag">${data.category}</div>
                            <h2 class="card-title">${data.title}</h2>
                        </div>
                    </div>
                    <p class="card-description">${data.description}</p>
                </div>
                <div class="keywords">
                    ${data.keywords.map(k => `<span class="keyword">#${k}</span>`).join('')}
                </div>
            `;

            cardViewport.innerHTML = '';
            cardViewport.appendChild(card);

            requestAnimationFrame(() => {
                card.classList.remove('enter');
                card.classList.add('active');
            });
        }

        function loadNextFact() {
            const currentCard = cardViewport.querySelector('.fact-card');
            if (currentCard) {
                currentCard.classList.remove('active');
                currentCard.classList.add('exit');
            }

            currentIndex = (currentIndex + 1) % TOTAL_FACTS;

            setTimeout(() => {
                renderCard(currentIndex, 'enter');
            }, 200);
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.service.js')
                    .then(reg => console.log('Ray Bytes Service Worker active:', reg.scope))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderCard(currentIndex, 'active');
        });
    </script>
</body>
</html>
