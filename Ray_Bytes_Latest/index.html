<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ray Bytes</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff4d4d">
    
    <style>
        /* Primary font: Futura (system + fallbacks). If you host Futura locally, replace the stack or add @font-face. */
        :root {
            --bg-color: #0a0b0d;
            --card-bg: rgba(255, 255, 255, 0.025);
            --card-border: rgba(255, 255, 255, 0.06);
            --text-primary: #f8fafc;
            --text-secondary: #9aa6b3;
            --accent-coral: #ff4d4d;
            --accent-coral-strong: #ff3b3b;
            --accent-blue: #38bdf8;
            --accent-purple: #c084fc;
            --card-padding-vertical: 40px;
            --card-padding-horizontal: 28px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Futura primary, with pragmatic fallbacks */
            font-family: 'Futura', 'Futura PT', 'Avenir Next', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(255, 77, 77, 0.04) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(192, 132, 252, 0.04) 0%, transparent 45%);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 880px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 28px;
            position: relative;
        }

        @media (min-width: 481px) {
            .app-container {
                border-radius: 32px;
                border: 1px solid transparent; /* gradient stroke handled on card */
                box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.75);
                backdrop-filter: blur(14px);
            }
        }

        /* Header Styling */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 18px; /* increased spacing to create clearer grid */
        }

        .logo {
            font-size: 15px;
            font-weight: 800; /* Futura Bold for brand */
            letter-spacing: 1.6px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--accent-coral), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .progress-indicator {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            background: rgba(255,255,255,0.02);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        /* Card Section with refined glassmorphism and gradient stroke */
        .card-viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            perspective: 1000px;
            margin: 22px 0; /* increased vertical gap between header and card */
        }

        .fact-card {
            width: 100%;
            height: 100%;
            max-height: 520px;
            background: linear-gradient(180deg, rgba(255,255,255,0.018), rgba(255,255,255,0.012));
            border-radius: 28px;
            padding: var(--card-padding-vertical) var(--card-padding-horizontal);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), inset 0 1px 0 0 rgba(255, 255, 255, 0.02);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            position: absolute;
            border: 1px solid var(--card-border);
            z-index: 1;
            overflow: hidden;
        }

        /* Subtle glow / gradient stroke using an :after pseudo element */
        .fact-card::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 30px;
            background: linear-gradient(90deg, rgba(255,77,77,0.07), rgba(192,132,252,0.06));
            filter: blur(10px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.95;
        }

        /* Micro-animations & States */
        .fact-card.enter {
            opacity: 0;
            transform: translateY(24px) scale(0.98);
        }

        .fact-card.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .fact-card.exit {
            opacity: 0;
            transform: translateY(-24px) scale(0.98);
        }

        .card-tag {
            font-size: 12px;
            font-weight: 800; /* Futura Bold */
            text-transform: uppercase;
            letter-spacing: 1.6px;
            color: var(--text-primary);
            margin-bottom: 14px;
        }

        .card-title {
            font-size: 22px;
            font-weight: 800; /* Futura Bold for headline */
            line-height: 1.2;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .card-description {
            font-size: 15px;
            font-weight: 500; /* Futura Medium / Book equivalent */
            line-height: 1.72; /* increased line-height for readability */
            letter-spacing: 0.18px; /* slight letter-spacing */
            color: var(--text-secondary);
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 8px; /* more breathing room for scrollbar */
        }

        /* Scrollbar aesthetics for descriptions */
        .card-description::-webkit-scrollbar {
            width: 6px;
        }
        .card-description::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
        }

        /* Footer Actions */
        .footer-actions {
            display: flex;
            flex-direction: column;
            gap: 16px; /* increased gap to make clearer grid */
            padding-top: 8px;
        }

        .next-btn {
            width: 100%;
            min-height: 56px;
            background: linear-gradient(135deg, var(--accent-coral), #ff7676);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 800; /* Futura Bold for CTA */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 30px rgba(255, 77, 77, 0.22);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            letter-spacing: 0.6px;
            font-family: 'Futura', 'Futura PT', 'Avenir Next', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            text-transform: none; /* keep natural casing from content */
        }

        .next-btn:active {
            transform: translateY(1px) scale(0.998);
            box-shadow: 0 6px 18px rgba(255, 77, 77, 0.18);
        }

        /* Subtle Pulse Micro-animation */
        @keyframes subtlePulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.34); }
            70% { box-shadow: 0 0 0 12px rgba(255, 77, 77, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
        }

        .next-btn {
            animation: subtlePulse 3.5s infinite;
        }

        .source-credit {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            opacity: 0.9;
            font-weight: 500;
        }
        
        .source-credit a {
            color: var(--text-secondary);
            text-decoration: none;
            border-bottom: 1px dashed rgba(255,255,255,0.03);
            padding-bottom: 2px;
        }

        /* Responsive tweaks */
        @media (max-width: 420px) {
            .card-title { font-size: 20px; }
            --card-padding-vertical: 32px;
            --card-padding-horizontal: 20px;
            .app-container { padding: 20px; }
            .next-btn { min-height: 52px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="logo">Ray Bytes</div>
            <div class="progress-indicator" id="progressIndicator">00001 / 50,000</div>
        </header>

        <!-- Main Card Viewport -->
        <div class="card-viewport" id="cardViewport"></div>

        <!-- Footer Actions -->
        <div class="footer-actions">
            <button class="next-btn" id="nextBtn" onclick="loadNextFact()">
                Next fact &gt;
            </button>
            <div class="source-credit"><a href="https://campaignbriefasia.com/" target="_blank">campaignbriefasia.com</a></div>
        </div>
    </div>

    <script>
        // Scaling set to map dynamically across 50,000 data nodes inspired by Campaign Brief Asia
        const TOTAL_FACTS = 50000;
        let currentIndex = 0;

        const categories = [
            "APAC Creative Wins", 
            "Agency Appointments", 
            "Digital & AI Innovation", 
            "Campaign Spotlights", 
            "Executive Moves"
        ];

        const cbTitles = [
            "VIRTUE Asia Expands Footprint Across Middle East Markets with VIRTUE Arabia Launch",
            "MAD STARS Executive Jury Unveils Breakthrough APAC Work That Defines Modern Culture",
            "Omnicom Media Group Appointed as Global Media Agency of Record for Key Accounts",
            "BBDO Guerrero Uses Local Telenovela Melodrama to Drive In-Flight Safety Recall",
            "TBWA\\Hakuhodo Deploys AI-Powered Analog Radio Tech for Dementia Reminiscence Therapy",
            "Leo Bangkok Secures Top Honors with Emotionally Resonant Financial Services Narrative",
            "E-Commerce App Growth Surges Across Southeast Asia as Regional Playbooks Diversify",
            "Brands Face Visibility Shifts as Generative AI Search Engine Optimization Rewrites Rules"
        ];

        const cbDescriptions = [
            "Industry reports tracked via Campaign Brief Asia highlight a major regional expansion strategy, focusing on localized cultural immersion and contextual storytelling to maximize consu[...],",
            "Creative leaders at major international festivals emphasize that campaigns rooting themselves in genuine empathy and human truths consistently outperform generic high-budget executions ac[...],",
            "Data models from recent quarters point toward a steep climb in performance-based, AI-enabled partnerships as brands optimize acquisition metrics against shifting media inflation rates and[...],",
            "Subtle layout choices, localized micro-interactions, and invisible technology integrations are transforming how digital touchpoints retain user attention across mobile-first networks[...],"
        ];

        // Algorithmic virtualization engine to seamlessly generate 50,000 unique records on the fly
        function getFactData(index) {
            const seed = index + 1;
            const category = categories[index % categories.length];
            const title = cbTitles[index % cbTitles.length];
            const baseDesc = cbDescriptions[index % cbDescriptions.length];
            const description = `${baseDesc} (Campaign Brief Asia Verified Fact Archive Record #CB-${seed * 37}).`;
            
            return {
                number: String(seed).padStart(5, '0'),
                category: category,
                title: `${title} [Part ${Math.ceil(seed / cbTitles.length)}]`,
                description: description
            };
        }

        const cardViewport = document.getElementById('cardViewport');
        const progressIndicator = document.getElementById('progressIndicator');

        function renderCard(index, direction = 'enter') {
            const data = getFactData(index);
            progressIndicator.innerText = `${data.number} / ${TOTAL_FACTS.toLocaleString()}`;

            const card = document.createElement('div');
            card.className = `fact-card ${direction}`;
            card.innerHTML = `
                <div>
                    <div class="card-tag">${data.category}</div>
                    <h2 class="card-title">${data.title}</h2>
                </div>
                <p class="card-description">${data.description}</p>
            `;

            cardViewport.innerHTML = '';
            cardViewport.appendChild(card);

            // Trigger smooth transition frame
            requestAnimationFrame(() => {
                card.classList.remove('enter');
                card.classList.add('active');
            });
        }

        function loadNextFact() {
            const currentCard = cardViewport.querySelector('.fact-card');
            if (currentCard) {
                currentCard.classList.remove('active');
                currentCard.classList.add('exit');
            }

            // Loop sequentially through up to 50,000 items
            currentIndex = (currentIndex + 1) % TOTAL_FACTS;

            setTimeout(() => {
                renderCard(currentIndex, 'enter');
            }, 200); // Matches exit transition timing
        }

        // Register Service Worker for PWA capabilities
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.service.js')
                    .then(reg => console.log('Ray Bytes Service Worker active:', reg.scope))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }

        // Initial Load
        window.addEventListener('DOMContentLoaded', () => {
            renderCard(currentIndex, 'active');
        });
    </script>
</body>
</html>
