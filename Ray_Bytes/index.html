<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ray Bytes/title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff4d4d">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0a0b0d;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-coral: #ff4d4d;
            --accent-blue: #38bdf8;
            --accent-purple: #c084fc;
            --glow-gradient: linear-gradient(135deg, rgba(255, 77, 77, 0.15), rgba(192, 132, 252, 0.15));
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 77, 77, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.08) 0%, transparent 40%);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            position: relative;
        }

        @media (min-width: 481px) {
            .app-container {
                border-radius: 32px;
                border: 1px solid var(--card-border);
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
                backdrop-filter: blur(20px);
            }
        }

        /* Header Styling */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
        }

        .logo {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--accent-coral), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .progress-indicator {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--card-bg);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
        }

        /* Card Section with Glassmorphism */
        .card-viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            perspective: 1000px;
            margin: 20px 0;
        }

        .fact-card {
            width: 100%;
            height: 100%;
            max-height: 480px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.3), inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            position: absolute;
        }

        /* Micro-animations & States */
        .fact-card.enter {
            opacity: 0;
            transform: translateY(20px) scale(0.96);
        }

        .fact-card.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .fact-card.exit {
            opacity: 0;
            transform: translateY(-20px) scale(0.96);
        }

        .card-tag {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-blue);
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.35;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .card-description {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-secondary);
            overflow-y: auto;
            flex-grow: 1;
        }

        /* Interactive Action Elements */
        .footer-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .next-btn {
            width: 100%;
            min-height: 52px;
            background: linear-gradient(135deg, var(--accent-coral), #ff7676);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(255, 77, 77, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .next-btn:active {
            transform: scale(0.97);
            box-shadow: 0 4px 10px rgba(255, 77, 77, 0.2);
        }

        /* Pulse Micro-animation */
        @keyframes subtlePulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 77, 77, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
        }

        .next-btn {
            animation: subtlePulse 3s infinite;
        }

        .source-credit {
            text-align: center;
            font-size: 11px;
            color: var(--text-secondary);
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="logo">CB Briefs</div>
            <div class="progress-indicator" id="progressIndicator">01 / 50,000</div>
        </header>

        <div class="card-viewport" id="cardViewport">
            </div>

        <div class="footer-actions">
            <button class="next-btn" id="nextBtn" onclick="loadNextFact()">
                Next Insight
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
            <div class="source-credit">Inspired by Campaign Brief Asia Curated Feeds</div>
        </div>
    </div>

    <script>
        // Total capability mapped to 50,000 facts dataset scale
        const TOTAL_FACTS = 50000;
        let currentIndex = 0;

        // Realistic seed categories mimicking Campaign Brief industry highlights
        const categories = ["APAC Advertising", "Creative Strategy", "Digital Media", "Brand Campaigns", "Industry Innovation"];
        
        const sampleTitles = [
            "AI-Driven Dynamic Personalization Dominates Q3 Creative Deployments",
            "The Shift Toward Immersive Storytelling in Regional Brand Experiences",
            "Redefining Consumer Engagement Through Micro-Interactions",
            "Maximizing Emotional Resonance in Cross-Platform Ad Frameworks",
            "The Evolution of Agency-Client Collaboration Models in Modern Markets"
        ];

        const sampleDescriptions = [
            "Recent industry updates highlight a substantial surge in localized creative executions leveraging real-time data adjustments. Agencies report a 34% increase in user retention when structural assets align directly with rapid consumer behavioral shifts.",
            "As digital attention spans fragment, leading creative shops across Asia-Pacific are incorporating layered audio-visual narratives that drive deeper long-term brand equity without relying on traditional interruption methods.",
            "Modern micro-animations and contextual user interfaces act as crucial touchpoints for reducing bounce rates. Data tracking confirms subtle responsive design choices drastically elevate overall campaign conversion scores."
        ];

        // Virtualized/Algorithmic generator to dynamically scale up to 50,000 unique records instantly 
        // without heavy upfront memory footprints or network bloat.
        function getFactData(index) {
            const seed = index + 1;
            const category = categories[index % categories.length];
            const title = `${sampleTitles[index % sampleTitles.length]} (#${seed})`;
            const description = sampleDescriptions[index % sampleDescriptions.length] + ` (Insight record verification reference ID: CB-${seed * 7}X).`;
            
            return {
                number: String(seed).padStart(5, '0'),
                category: category,
                title: title,
                description: description
            };
        }

        const cardViewport = document.getElementById('cardViewport');
        const progressIndicator = document.getElementById('progressIndicator');

        function renderCard(index, direction = 'enter') {
            const data = getFactData(index);
            progressIndicator.innerText = `${data.number} / ${TOTAL_FACTS.toLocaleString()}`;

            const card = document.createElement('div');
            card.className = `fact-card ${direction}`;
            card.innerHTML = `
                <div>
                    <div class="card-tag">${data.category}</div>
                    <h2 class="card-title">${data.title}</h2>
                </div>
                <p class="card-description">${data.description}</p>
            `;

            cardViewport.innerHTML = '';
            cardViewport.appendChild(card);

            // Trigger smooth entrance transition frame
            requestAnimationFrame(() => {
                card.classList.remove('enter');
                card.classList.add('active');
            });
        }

        function loadNextFact() {
            const currentCard = cardViewport.querySelector('.fact-card');
            if (currentCard) {
                currentCard.classList.remove('active');
                currentCard.classList.add('exit');
            }

            // Loop smoothly back to start once 50,000 threshold is reached
            currentIndex = (currentIndex + 1) % TOTAL_FACTS;

            setTimeout(() => {
                renderCard(currentIndex, 'enter');
            }, 200); // Sync timing with exit animation duration
        }

        // Initialize Service Worker for PWA compliance
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.service.js')
                    .then(reg => console.log('Service Worker registered successfully:', reg.scope))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }

        // Initial First Render Load
        window.addEventListener('DOMContentLoaded', () => {
            renderCard(currentIndex, 'active');
        });
    </script>
</body>
</html>
