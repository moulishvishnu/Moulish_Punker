<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ray Bytes</title>
    
    <meta name="theme-color" content="#0a0a0c">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container" id="appContainer">
        <div class="bg-ornaments" aria-hidden="true"></div>

        <header class="app-header">
            <div class="brand" role="banner">
                <span class="pulse-dot" aria-hidden="true"></span>
                <h1>Ray <span>Bytes</span></h1>
                <p class="tagline">Daily bytes of marketing & tech</p>
            </div>
            <div class="controls">
                <div class="counter-badge" id="counterBadge" aria-live="polite">01 / ∞</div>
                <button id="playPauseBtn" class="icon-btn" aria-pressed="true" title="Pause autoplay">⏸</button>
            </div>
        </header>

        <main class="card-viewport">
            <div class="fact-card" id="factCard" tabindex="0" aria-live="polite">
                <div class="card-tag" id="cardCategory">Agency Brief</div>
                <div class="stat-highlight" id="cardStat">#1 Trend</div>
                <h2 class="card-title" id="cardTitle">Loading Ray Bytes...</h2>
                <p class="card-description" id="cardDesc">Please wait while we curate the latest updates from the region.</p>
            </div>
        </main>

        <footer class="app-footer">
            <button class="cta-button" id="nextBtn" aria-label="Next Fact">
                <span>Next Insight</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
